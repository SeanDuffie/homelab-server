services:
  minecraft-forge-server:
    image: itzg/minecraft-server
    restart: unless-stopped

    tty: true
    stdin_open: true

    environment:
      EULA: "TRUE"
      TYPE: "${SERVER_TYPE}"
      VERSION: "26.1.2"
      # SEED: ""

      MODRINTH_PROJECTS: "jei, appleskin, waystones"
      MODRINTH_ALLOWED_VERSION_TYPE: "beta"

      MEMORY: "4G"
      SIMULATION_DISTANCE: 16
      LOG_IPS: "true"
      # TODO: Add MODs here
      OPS: "${OPS}"
      MOTD: "${MOTD}"
      ICON: /server-icon.png
      OVERRIDE_ICON: true
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"

    env_file:
      - .env

    volumes:
      - ./data/world:/data
      - ./config:/config
      - ./server-icon.png:/server-icon.png

    labels:
    - "mc-router.host=${SERVER_URL}"
    - "mc-router.auto-scale-down=true"
    - "mc-router.scale-down-after=2h"

    networks:
      - mc-network


  mc-neoforge-backup:
    image: itzg/mc-backup

    depends_on:
      - minecraft-neoforge-server

    environment:
      RCON_HOST: "minecraft-neoforge-server"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      BACKUP_INTERVAL: "1h"
      PRUNE_BACKUPS_DAYS: 7
      PAUSE_IF_NO_PLAYERS: "true"

    volumes:
      - ./data:/data:ro
      - ./backups:/backups

    networks:
      - mc-network


networks:
  mc-network:
    external: true