services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"     # HTTP Ingress
      - "443:443"   # HTTPS Ingress
      - "81:81"     # Admin Web GUI
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    networks:
    - homelab-proxy

