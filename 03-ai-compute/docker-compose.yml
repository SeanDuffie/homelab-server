services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    networks:
    - homelab-proxy
    volumes:
      - ./data/ollama:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    networks:
    - homelab-proxy
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    volumes:
      - ./data/open-webui:/app/backend/data
    depends_on:
      - ollama

  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    networks:
    - homelab-proxy
    volumes:
      - ./data/searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://${LOCAL_IP}:8081/
    depends_on:
      - redis-searxng

  redis-searxng:
    image: redis:alpine
    container_name: redis-searxng
    restart: unless-stopped
    command: redis-server --save 30 1 --loglevel warning
    networks:
    - homelab-proxy
    volumes:
      - ./data/redis-searxng:/data

networks:
  homelab-proxy:
    external: true